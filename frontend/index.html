<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Software Quality Hub</title>

    <!--
      Las fuentes se precargan para que el navegador las pida al mismo tiempo
      que el CSS, y no despues de leerlo. Sin esto el texto se dibuja una vez
      con la fuente del sistema y vuelve a dibujarse al llegar la propia, que
      se ve como un salto.
    -->
    <link
      rel="preload"
      href="/fuentes/ibm-plex-sans-variable-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fuentes/ibm-plex-mono-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <!-- React se monta completo dentro de este div vacio. -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
